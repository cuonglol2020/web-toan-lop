<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Web Toán Lớp Em</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      font-family: Arial, sans-serif;
      background: #f0f4f8;
      margin: 0;
      padding: 16px;
      color: #1a202c;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
    }
    h1 {
      text-align: center;
      color: #2b6cb0;
    }
    h2 {
      color: #2d3748;
      border-bottom: 2px solid #2b6cb0;
      padding-bottom: 6px;
    }
    .khungTron {
      background: white;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 20px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
    input[type="text"], textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #cbd5e0;
      border-radius: 8px;
      font-size: 16px;
      margin-bottom: 10px;
    }
    button {
      background: #2b6cb0;
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 15px;
      cursor: pointer;
    }
    button:hover {
      background: #2c5282;
    }
    button.nutGiai {
      background: #38a169;
    }
    button.nutGiai:hover {
      background: #2f855a;
    }
    ol#bangXepHang {
      background: white;
      border-radius: 12px;
      padding: 16px 16px 16px 36px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      margin-bottom: 20px;
    }
    .hopDe {
      background: white;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 14px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
    .hopDe ul {
      padding-left: 20px;
      margin: 8px 0;
    }
    .hopDe input[type="text"] {
      width: 70%;
      display: inline-block;
      margin-bottom: 0;
    }
    .hopDe button {
      padding: 10px 14px;
    }
    .soNguoiGiai {
      color: #38a169;
      font-weight: bold;
      font-size: 14px;
      margin: 6px 0;
    }
    .dsNguoiGiai {
      font-size: 13px;
      color: #718096;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Web Toán Lớp Em</h1>

    <h2>🏆 Bảng xếp hạng</h2>
    <ol id="bangXepHang"></ol>

    <h2>Đăng đề toán mới</h2>
    <div class="khungTron">
      <input type="text" id="tenNguoiDang" placeholder="Tên bạn">
      <textarea id="noiDungDe" placeholder="Nhập đề toán ở đây..." rows="3"></textarea>
      <button onclick="dangDe()">Đăng đề</button>
    </div>

    <h2>Danh sách đề toán</h2>
    <div id="danhSachDe"></div>
  </div>

  <!-- Thư viện Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDRkE7rqFMP1X2WYny7vn9Q-ITlRIh2PSo",
      authDomain: "web-toan-lop.firebaseapp.com",
      databaseURL: "https://web-toan-lop-default-rtdb.firebaseio.com",
      projectId: "web-toan-lop",
      storageBucket: "web-toan-lop.firebasestorage.app",
      messagingSenderId: "359002597389",
      appId: "1:359002597389:web:8bb1110550762a43b04d44"
    };

    firebase.initializeApp(firebaseConfig);
    var db = firebase.database();

    function dangDe() {
      var ten = document.getElementById("tenNguoiDang").value;
      var noiDung = document.getElementById("noiDungDe").value;

      if (ten === "" || noiDung === "") {
        alert("Bạn chưa nhập đủ tên và đề toán!");
        return;
      }

      db.ref("deToan").push({
        ten: ten,
        noiDung: noiDung
      });

      document.getElementById("tenNguoiDang").value = "";
      document.getElementById("noiDungDe").value = "";
    }

    function themBinhLuan(idDe) {
      var oNhap = document.getElementById("binhLuan" + idDe);
      var noiDungBL = oNhap.value;

      if (noiDungBL === "") {
        alert("Bạn chưa nhập bình luận!");
        return;
      }

      db.ref("deToan/" + idDe + "/binhLuan").push(noiDungBL);
      oNhap.value = "";
    }

    function danhDauDaGiai(idDe) {
      var tenNguoiGiai = prompt("Bạn tên gì?");

      if (!tenNguoiGiai || tenNguoiGiai.trim() === "") {
        return;
      }

      // Dùng tên làm "key" luôn để 1 người không đánh dấu trùng nhiều lần
      db.ref("deToan/" + idDe + "/daGiai/" + tenNguoiGiai.trim()).set(true);
    }

    function capNhatBangXepHang(danhSachDe) {
      var diem = {};

      danhSachDe.forEach(function(de) {
        if (diem[de.ten]) {
          diem[de.ten]++;
        } else {
          diem[de.ten] = 1;
        }
      });

      var mangXepHang = Object.keys(diem).map(function(ten) {
        return { ten: ten, soDe: diem[ten] };
      });

      mangXepHang.sort(function(a, b) {
        return b.soDe - a.soDe;
      });

      var khungBXH = document.getElementById("bangXepHang");
      khungBXH.innerHTML = "";
      mangXepHang.forEach(function(nguoi) {
        var dong = document.createElement("li");
        dong.textContent = nguoi.ten + " - " + nguoi.soDe + " đề";
        khungBXH.appendChild(dong);
      });
    }

    db.ref("deToan").on("value", function(snapshot) {
      var khungHienThi = document.getElementById("danhSachDe");
      khungHienThi.innerHTML = "";

      var danhSachDe = [];
      snapshot.forEach(function(childSnapshot) {
        danhSachDe.push(childSnapshot.val());
      });
      capNhatBangXepHang(danhSachDe);

      snapshot.forEach(function(childSnapshot) {
        var idDe = childSnapshot.key;
        var de = childSnapshot.val();

        var hopDe = document.createElement("div");
        hopDe.className = "hopDe";

        var tieuDe = document.createElement("p");
        tieuDe.innerHTML = "<b>" + de.ten + "</b>: " + de.noiDung;
        hopDe.appendChild(tieuDe);

        // Phần hiển thị "đã giải được"
        var danhSachNguoiGiai = de.daGiai ? Object.keys(de.daGiai) : [];

        var soNguoiGiai = document.createElement("p");
        soNguoiGiai.className = "soNguoiGiai";
        soNguoiGiai.textContent = "✅ " + danhSachNguoiGiai.length + " bạn đã giải được";
        hopDe.appendChild(soNguoiGiai);

        if (danhSachNguoiGiai.length > 0) {
          var dsTen = document.createElement("p");
          dsTen.className = "dsNguoiGiai";
          dsTen.textContent = danhSachNguoiGiai.join(", ");
          hopDe.appendChild(dsTen);
        }

        var nutDaGiai = document.createElement("button");
        nutDaGiai.className = "nutGiai";
        nutDaGiai.textContent = "✅ Đã giải được";
        nutDaGiai.onclick = (function(id) {
          return function() { danhDauDaGiai(id); };
        })(idDe);
        hopDe.appendChild(nutDaGiai);

        // Phần bình luận
        var dsBL = document.createElement("ul");
        if (de.binhLuan) {
          Object.values(de.binhLuan).forEach(function(bl) {
            var dongBL = document.createElement("li");
            dongBL.textContent = bl;
            dsBL.appendChild(dongBL);
          });
        }
        hopDe.appendChild(dsBL);

        var oNhapBL = document.createElement("input");
        oNhapBL.type = "text";
        oNhapBL.id = "binhLuan" + idDe;
        oNhapBL.placeholder = "Viết bình luận...";
        hopDe.appendChild(oNhapBL);

        var nutGuiBL = document.createElement("button");
        nutGuiBL.textContent = "Gửi";
        nutGuiBL.onclick = (function(id) {
          return function() { themBinhLuan(id); };
        })(idDe);
        hopDe.appendChild(nutGuiBL);

        khungHienThi.appendChild(hopDe);
      });
    });
  </script>
</body>
</html>
